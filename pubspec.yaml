name: invygo
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  bloc: ^9.1.0
  cached_network_image: ^3.4.1
  card_swiper: ^3.0.1
  collection: ^1.19.1
  connectivity_plus: ^6.1.5
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  drift: ^2.28.1
  dropdown_search: ^6.0.2
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_advanced_drawer: ^1.5.0
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_sliding_box: 1.1.5
  get: ^4.7.2
  get_it: ^8.2.0
  go_router: ^16.2.0
  http: ^1.5.0
  image_picker: ^1.2.0
  internet_connection_checker: ^3.0.1
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  phone_form_field: ^10.0.8
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sqlite3_flutter_libs: ^0.5.39
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ^2.28.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/en.json
    - assets/l10n/ar.json
    - assets/l10n/fr.json
    - assets/images/
    - assets/fonts/
    - assets/logo/logo.png
    - assets/images/arabic-language.png
    - assets/images/english-language.png
    - assets/images/user_avatar.png

fonts:
  - family: Intro
    fonts:
      - asset: assets/fonts/Intro Thin Alt.otf
        weight: 100
      - asset: assets/fonts/Intro Light Alt.otf
        weight: 300
      - asset: assets/fonts/Intro Book Alt.otf
        weight: 400
      - asset: assets/fonts/Intro Regular Alt.otf
        weight: 500
      - asset: assets/fonts/Intro Bold Alt.otf
        weight: 700
      - asset: assets/fonts/Intro Black Alt.otf
        weight: 900

  - family: Cairo
    fonts:
      - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        weight: 400
      - asset: assets/fonts/Cairo/Cairo-Medium.ttf
        weight: 500
      - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Cairo/Cairo-Bold.ttf
        weight: 700

flutter_native_splash:
  android: true
  ios: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  image: "assets/logo/splashLogo.png"
  color: "#001172"
  branding: "assets/logo/branding.png"

  android_12:
    fullscreen: true
    android_gravity: center
    image: assets/logo/splashLogo-android12.png
    branding: "assets/logo/branding-android12.png"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: "AppIcon"
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#001172"
  adaptive_icon_foreground: "assets/logo/logo.png"
  min_sdk_android: 23
  remove_alpha_ios: true
